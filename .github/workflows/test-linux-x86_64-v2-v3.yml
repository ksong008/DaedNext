name: Test Linux x86_64 v2-v3

on:
  workflow_dispatch:
    inputs:
      daenext_ref:
        description: Optional DaeNext core ref override. Empty uses .github/daenext-core-ref.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: test-linux-x86_64-v2-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-daenext-ref:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    outputs:
      daenext_ref: ${{ steps.resolve.outputs.daenext_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve DaeNext core ref
        id: resolve
        env:
          INPUT_REF: ${{ inputs.daenext_ref }}
        run: |
          set -euo pipefail
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref="$(tr -d '[:space:]' < .github/daenext-core-ref)"
          fi
          test -n "$ref"
          echo "daenext_ref=$ref" >>"$GITHUB_OUTPUT"

  build-linux-x86_64:
    needs: [resolve-daenext-ref]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu_level: v2
            output_name: daed-linux-x86_64_v2_sse
            rustflags: -C target-cpu=x86-64-v2
          - cpu_level: v3
            output_name: daed-linux-x86_64_v3_avx2
            rustflags: -C target-cpu=x86-64-v3
    env:
      TARGET_OS: linux
      TARGET_ARCH: x86_64
      CPU_LEVEL: ${{ matrix.cpu_level }}
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: ${{ needs.resolve-daenext-ref.outputs.daenext_ref }}
          path: DaeNext
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default stable
          cargo install bpf-linker --version 0.10.3 --locked
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            DaeNext -> target

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          for attempt in 1 2 3; do
            if sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libelf-dev \
            llvm \
            pkg-config

      - name: Build web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build --filter daed

      - name: Build Rust native daed
        env:
          VERSION: test-${{ github.sha }}
          OUTPUT: bundled/${{ matrix.output_name }}
          APPNAME: daed
          DAED_SKIP_WEB_BUILD: 1
          RUST_WORKSPACE: ${{ github.workspace }}/DaeNext
        run: |
          mkdir -p bundled
          make

      - name: Smoke test
        run: ./bundled/${{ matrix.output_name }} --version

      - name: Collect runtime files
        run: |
          mkdir -p artifact
          cp bundled/${{ matrix.output_name }} artifact/daed
          cp install/daed.service artifact/
          cp install/daed.desktop artifact/
          cp -r install/icons artifact/icons
          cp -r apps/web/dist artifact/web
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --show-error \
            -o artifact/geoip.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --show-error \
            -o artifact/geosite.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat
          tar -C artifact -czf ${{ matrix.output_name }}-test.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}-test
          retention-days: 7
          path: |
            artifact/**
            ${{ matrix.output_name }}-test.tar.gz
