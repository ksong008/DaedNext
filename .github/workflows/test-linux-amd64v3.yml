name: Test Linux x86_64 v2-v3

on:
  workflow_dispatch:

concurrency:
  group: test-linux-x86_64-v2-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goamd64: v2
            output_name: daed-linux-x86_64_v2_sse
            rustflags: -C target-cpu=x86-64-v2
          - goamd64: v3
            output_name: daed-linux-x86_64_v3_avx2
            rustflags: -C target-cpu=x86-64-v3
    env:
      GOOS: linux
      GOARCH: amd64
      GOAMD64: ${{ matrix.goamd64 }}
      CGO_ENABLED: 0
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: main
          path: DaeNext

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default stable
          cargo install bpf-linker --version 0.10.3 --locked

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Build web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install
          pnpm build --filter daed

      - name: Build Rust native daed
        env:
          VERSION: test-${{ github.sha }}
          OUTPUT: bundled/${{ matrix.output_name }}
          APPNAME: daed
          DAED_SKIP_WEB_BUILD: 1
          RUST_WORKSPACE: ${{ github.workspace }}/DaeNext
        run: |
          mkdir -p bundled
          make

      - name: Smoke test
        run: ./bundled/${{ matrix.output_name }} --version

      - name: Collect runtime files
        run: |
          mkdir -p artifact
          cp bundled/${{ matrix.output_name }} artifact/daed
          cp install/daed.service artifact/
          cp install/daed.desktop artifact/
          cp -r install/icons artifact/icons
          cp -r apps/web/dist artifact/web
          curl -L -o artifact/geoip.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl -L -o artifact/geosite.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat
          tar -C artifact -czf ${{ matrix.output_name }}-test.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}-test
          path: |
            artifact/**
            ${{ matrix.output_name }}-test.tar.gz
