name: DaedNext Integration

on:
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: daednext-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-surface-lint:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check retired frontend markers
        run: bash ./scripts/check_retired_frontend_markers.sh

  web-quality:
    needs: web-surface-lint
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck daed
        run: pnpm --filter daed check-types
      - name: Run daed unit tests
        run: pnpm --filter daed test

  build-linux-x86_64:
    needs: web-quality
    name: Build Linux x86_64 ${{ matrix.cpu_level }}
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu_level: v2
            output_name: daed-linux-x86_64_v2_sse
            rustflags: -C target-cpu=x86-64-v2
          - cpu_level: v3
            output_name: daed-linux-x86_64_v3_avx2
            rustflags: -C target-cpu=x86-64-v3
    env:
      TARGET_OS: linux
      TARGET_ARCH: x86_64
      CPU_LEVEL: ${{ matrix.cpu_level }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: main
          path: DaeNext
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default stable
          cargo install bpf-linker --version 0.10.3 --locked
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build --filter daed
      - name: Build Rust native daed
        env:
          VERSION: test-${{ github.sha }}
          OUTPUT: bundled/${{ matrix.output_name }}
          APPNAME: daed
          DAED_SKIP_WEB_BUILD: 1
          RUST_WORKSPACE: ${{ github.workspace }}/DaeNext
        run: |
          mkdir -p bundled
          make
      - name: Smoke test
        run: ./bundled/${{ matrix.output_name }} --version
      - name: Collect runtime files
        run: |
          mkdir -p artifact
          cp bundled/${{ matrix.output_name }} artifact/daed
          cp install/daed.service artifact/
          cp install/daed.desktop artifact/
          cp -r install/icons artifact/icons
          cp -r apps/web/dist artifact/web
          curl -L -o artifact/geoip.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl -L -o artifact/geosite.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat
          tar -C artifact -czf ${{ matrix.output_name }}-test.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}-test
          path: |
            artifact/**
            ${{ matrix.output_name }}-test.tar.gz
