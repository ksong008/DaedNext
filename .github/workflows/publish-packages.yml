name: Publish Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@daeuniverse'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter "@daeuniverse/*"

      - name: Publish selected package
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/dae-editor-v*) package_dir="packages/dae-editor" ;;
            refs/tags/dae-node-parser-v*) package_dir="packages/dae-node-parser" ;;
            refs/tags/dae-lsp-v*) package_dir="packages/dae-lsp" ;;
            refs/tags/dae-lang-core-v*) package_dir="packages/dae-lang-core" ;;
            *)
              echo "No package tag matched ${GITHUB_REF}; nothing to publish."
              exit 0
              ;;
          esac

          output="$(mktemp)"
          if (cd "$package_dir" && pnpm publish --access public --no-git-checks) >"$output" 2>&1; then
            cat "$output"
            exit 0
          fi

          cat "$output"
          if grep -Eiq 'already exists|previously published|cannot publish over' "$output"; then
            echo "Package version already exists; treating publish as idempotent."
            exit 0
          fi
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
