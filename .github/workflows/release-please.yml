name: Release Please

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.26.0)'
        required: false

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  packages: write

jobs:
  release-please:
    runs-on: macos-latest
    outputs:
      manual_release: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && 'true' || 'false' }}
      release_branch: ${{ github.ref_name }}
      checkout_ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && github.sha) || steps.release.outputs['apps/web--tag_name'] || github.sha }}
      tag_name: ${{ steps.release.outputs['apps/web--tag_name'] || inputs.tag_name }}
      release_created: ${{ steps.release.outputs['apps/web--release_created'] || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && 'true') || 'false' }}
      publish_extras: ${{ (steps.release.outputs['apps/web--release_created'] == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')) && 'true' || 'false' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag_name == '' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}

  # Update screenshots when a new release is created
  update-screenshots:
    needs: release-please
    if: ${{ needs.release-please.outputs.publish_extras == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: '22.12.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate screenshots
        run: pnpm screenshot

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update screenshots for ${{ needs.release-please.outputs.tag_name }} [skip ci]'
          title: 'chore: update screenshots for ${{ needs.release-please.outputs.tag_name }} [skip ci]'
          body: |
            Auto-generated screenshots update for ${{ needs.release-please.outputs.tag_name }}

            ## Desktop Screenshots

            | Setup | Orchestrate |
            |-------|-------------|
            | ![Setup](https://raw.githubusercontent.com/${{ github.repository }}/chore/update-screenshots/docs/screenshots/pc/setup.png) | ![Orchestrate](https://raw.githubusercontent.com/${{ github.repository }}/chore/update-screenshots/docs/screenshots/pc/orchestrate.png) |

            ## Mobile Screenshots

            | Setup | Orchestrate |
            |-------|-------------|
            | <img src="https://raw.githubusercontent.com/${{ github.repository }}/chore/update-screenshots/docs/screenshots/mobile/setup.png" width="300" /> | <img src="https://raw.githubusercontent.com/${{ github.repository }}/chore/update-screenshots/docs/screenshots/mobile/orchestrate.png" width="300" /> |
          base: ${{ needs.release-please.outputs.release_branch }}
          branch: chore/update-screenshots
          delete-branch: true
          add-paths: docs/screenshots/

  checkout-full-src:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: main
          path: DaeNext
          persist-credentials: false

      - name: Verify Rust native source archive inputs
        run: |
          test -f Makefile
          test -d apps/web
          test -f DaeNext/Cargo.toml

      - name: Create full source ZIP archive and Signature
        run: |
          zip -9vr daed-full-src.zip . -x .git/\* -x '*/.git/*'

      - uses: actions/upload-artifact@v7
        with:
          name: daed-full-src.zip
          path: daed-full-src.zip

  build-web:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: '22.12.0'

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build --filter daed

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: apps/web/dist

  # Publish GitHub Pages when a new release is created
  publish-gh-pages:
    needs: [release-please, build-web]
    if: ${{ needs.release-please.outputs.publish_extras == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: dist/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  build-bundle:
    needs: [release-please, build-web]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # BEGIN Linux x86_32 / RISC-V / ARM64
          - target_os: linux
            target_arch: x86_32
            rust_target: i686-unknown-linux-gnu
            cargo_target_env: I686_UNKNOWN_LINUX_GNU
            cross_packages: gcc-i686-linux-gnu g++-i686-linux-gnu
            linker: i686-linux-gnu-gcc
            cc: i686-linux-gnu-gcc
            cxx: i686-linux-gnu-g++
            ar: i686-linux-gnu-ar
          - target_os: linux
            target_arch: riscv64
            rust_target: riscv64gc-unknown-linux-gnu
            cargo_target_env: RISCV64GC_UNKNOWN_LINUX_GNU
            cross_packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            linker: riscv64-linux-gnu-gcc
            cc: riscv64-linux-gnu-gcc
            cxx: riscv64-linux-gnu-g++
            ar: riscv64-linux-gnu-ar
          - target_os: linux
            target_arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            cargo_target_env: AARCH64_UNKNOWN_LINUX_GNU
            cross_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            ar: aarch64-linux-gnu-ar
          # END Linux x86_32 / RISC-V / ARM64

          # BEGIN Linux x86_64 v1 v2 v3
          - target_os: linux
            target_arch: x86_64
            cpu_level: v1
            rustflags: -C target-cpu=x86-64
            rust_target: ''
            cargo_target_env: ''
            cross_packages: ''
            linker: ''
            cc: ''
            cxx: ''
            ar: ''
          - target_os: linux
            target_arch: x86_64
            cpu_level: v2
            rustflags: -C target-cpu=x86-64-v2
            rust_target: ''
            cargo_target_env: ''
            cross_packages: ''
            linker: ''
            cc: ''
            cxx: ''
            ar: ''
          - target_os: linux
            target_arch: x86_64
            cpu_level: v3
            rustflags: -C target-cpu=x86-64-v3
            rust_target: ''
            cargo_target_env: ''
            cross_packages: ''
            linker: ''
            cc: ''
            cxx: ''
            ar: ''
          # END Linux x86_64 v1 v2 v3

          # BEGIN Linux MIPS
          - target_os: linux
            target_arch: mips64
            rust_target: mips64-unknown-linux-gnuabi64
            cargo_target_env: MIPS64_UNKNOWN_LINUX_GNUABI64
            cross_packages: gcc-mips64-linux-gnuabi64 g++-mips64-linux-gnuabi64
            linker: mips64-linux-gnuabi64-gcc
            cc: mips64-linux-gnuabi64-gcc
            cxx: mips64-linux-gnuabi64-g++
            ar: mips64-linux-gnuabi64-ar
          - target_os: linux
            target_arch: mips64le
            rust_target: mips64el-unknown-linux-gnuabi64
            cargo_target_env: MIPS64EL_UNKNOWN_LINUX_GNUABI64
            cross_packages: gcc-mips64el-linux-gnuabi64 g++-mips64el-linux-gnuabi64
            linker: mips64el-linux-gnuabi64-gcc
            cc: mips64el-linux-gnuabi64-gcc
            cxx: mips64el-linux-gnuabi64-g++
            ar: mips64el-linux-gnuabi64-ar
          - target_os: linux
            target_arch: mipsle
            rust_target: mipsel-unknown-linux-gnu
            cargo_target_env: MIPSEL_UNKNOWN_LINUX_GNU
            cross_packages: gcc-mipsel-linux-gnu g++-mipsel-linux-gnu
            linker: mipsel-linux-gnu-gcc
            cc: mipsel-linux-gnu-gcc
            cxx: mipsel-linux-gnu-g++
            ar: mipsel-linux-gnu-ar
          - target_os: linux
            target_arch: mips
            rust_target: mips-unknown-linux-gnu
            cargo_target_env: MIPS_UNKNOWN_LINUX_GNU
            cross_packages: gcc-mips-linux-gnu g++-mips-linux-gnu
            linker: mips-linux-gnu-gcc
            cc: mips-linux-gnu-gcc
            cxx: mips-linux-gnu-g++
            ar: mips-linux-gnu-ar
          # END Linux MIPS
      fail-fast: false

    env:
      TARGET_OS: ${{ matrix.target_os }}
      TARGET_ARCH: ${{ matrix.target_arch }}
      CPU_LEVEL: ${{ matrix.cpu_level }}
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: main
          path: DaeNext
          persist-credentials: false

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default stable
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add "${{ matrix.rust_target }}"
          fi
          cargo install bpf-linker --version 0.10.3 --locked

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          cross_packages="${{ matrix.cross_packages }}"
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          for attempt in 1 2 3; do
            if sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libelf-dev \
            llvm \
            perl \
            pkg-config \
            $cross_packages

      - name: Configure Rust cross target
        run: |
          set -euo pipefail
          rust_target="${{ matrix.rust_target }}"
          cargo_target_env="${{ matrix.cargo_target_env }}"
          linker="${{ matrix.linker }}"
          cc="${{ matrix.cc }}"
          cxx="${{ matrix.cxx }}"
          ar="${{ matrix.ar }}"
          if [ -z "$rust_target" ]; then
            exit 0
          fi
          rust_target_env="${rust_target//-/_}"
          echo "RUST_TARGET=${rust_target}" >>"${GITHUB_ENV}"
          echo "CARGO_TARGET_${cargo_target_env}_LINKER=${linker}" >>"${GITHUB_ENV}"
          echo "CC_${rust_target_env}=${cc}" >>"${GITHUB_ENV}"
          echo "CXX_${rust_target_env}=${cxx}" >>"${GITHUB_ENV}"
          echo "AR_${rust_target_env}=${ar}" >>"${GITHUB_ENV}"

      - name: Get the version
        id: get_version
        env:
          REF: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tag=${REF}
          version=${tag%-daed-test}
          package_version="${version:1}"
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$package_version" >> $GITHUB_OUTPUT
          echo "PACKAGE_VERSION=$package_version" >> $GITHUB_ENV

      - name: Get the filename
        id: get_filename
        run: |
          target_key="${TARGET_OS}-${TARGET_ARCH}${CPU_LEVEL:+-${CPU_LEVEL}}"
          _NAME=$(jq --arg target "$target_key" '.[$target].friendlyName' -r < install/friendly-filenames.json)
          test "$_NAME" != "null"
          echo "target_os: $TARGET_OS, target_arch: $TARGET_ARCH, cpu_level: $CPU_LEVEL, release_name: $_NAME"
          echo "BUNDLE_NAME=daed-$_NAME" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: dist/

      - name: make
        env:
          RUST_WORKSPACE: ${{ github.workspace }}/DaeNext
        run: |
          mkdir -p ./bundled/
          export VERSION=${{ steps.get_version.outputs.VERSION }}
          export DAED_SKIP_WEB_BUILD=1
          export OUTPUT=bundled/${{ steps.get_filename.outputs.BUNDLE_NAME }}
          make
          cp ./install/daed.service ./bundled/
          cp ./install/daed.desktop ./bundled/
          cp -r ./install/icons/ ./bundled/
          cp -r ./dist ./bundled/web
          curl -L -o ./bundled/geoip.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl -L -o ./bundled/geosite.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat

      - name: Upload artifact - bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get_filename.outputs.BUNDLE_NAME }}
          path: bundled/*

      - name: Smoking test
        if: matrix.target_arch == 'x86_64' && matrix.cpu_level == 'v1'
        run: ./bundled/${{ steps.get_filename.outputs.BUNDLE_NAME }} --version

      - name: Build Linux packages
        run: |
          set -euo pipefail
          mkdir -p ./output_packages/
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm
          sudo gem install fpm -v 1.15.1
          target_key="${TARGET_OS}-${TARGET_ARCH}${CPU_LEVEL:+-${CPU_LEVEL}}"
          package_file_base="daed-${target_key}"
          pushd bundled || exit 1
          ./${{ steps.get_filename.outputs.BUNDLE_NAME }} --version | grep -F 'bpf-btf'
          rm -rf package-root
          mkdir -p package-root/usr/bin \
            package-root/usr/lib/systemd/system \
            package-root/usr/share/applications \
            package-root/usr/share/daed/web \
            package-root/usr/share/icons/hicolor/{16x16,32x32,64x64,128x128,256x256,512x512,1024x1024}/apps
          install -m 0755 ./${{ steps.get_filename.outputs.BUNDLE_NAME }} package-root/usr/bin/daed
          install -m 0644 ./geoip.dat package-root/usr/share/daed/geoip.dat
          install -m 0644 ./geosite.dat package-root/usr/share/daed/geosite.dat
          install -m 0644 ./daed.service package-root/usr/lib/systemd/system/daed.service
          install -m 0644 ./daed.desktop package-root/usr/share/applications/daed.desktop
          cp -a ./web/. package-root/usr/share/daed/web/
          install -m 0644 ./icons/16x16.png package-root/usr/share/icons/hicolor/16x16/apps/daed.png
          install -m 0644 ./icons/32x32.png package-root/usr/share/icons/hicolor/32x32/apps/daed.png
          install -m 0644 ./icons/64x64.png package-root/usr/share/icons/hicolor/64x64/apps/daed.png
          install -m 0644 ./icons/128x128.png package-root/usr/share/icons/hicolor/128x128/apps/daed.png
          install -m 0644 ./icons/256x256.png package-root/usr/share/icons/hicolor/256x256/apps/daed.png
          install -m 0644 ./icons/512x512.png package-root/usr/share/icons/hicolor/512x512/apps/daed.png
          install -m 0644 ./icons/1024x1024.png package-root/usr/share/icons/hicolor/1024x1024/apps/daed.png
          ARCH_PACMAN='pacman'
          case "$TARGET_ARCH" in
            mips*) ARCH_PACMAN='' ;;
          esac
          for package_manager in deb rpm $ARCH_PACMAN; do
            case "$package_manager:$TARGET_ARCH" in
              deb:x86_32) package_arch='i386' ;;
              deb:x86_64) package_arch='amd64' ;;
              deb:aarch64) package_arch='arm64' ;;
              deb:mips64le) package_arch='mips64el' ;;
              deb:mipsle) package_arch='mipsel' ;;
              rpm:x86_32) package_arch='i386' ;;
              rpm:x86_64|pacman:x86_64) package_arch='x86_64' ;;
              rpm:mips64le) package_arch='mips64el' ;;
              rpm:mipsle) package_arch='mipsel' ;;
              pacman:x86_32) package_arch='i686' ;;
              rpm:aarch64|pacman:aarch64) package_arch='aarch64' ;;
              *) package_arch="$TARGET_ARCH" ;;
            esac
            fpm -s dir -t "$package_manager" -a $package_arch --version "$PACKAGE_VERSION" \
              --url 'https://github.com/ksong008/DaedNext' --description "DaedNext product shell for dae." \
              --maintainer "DaedNext Maintainers <noreply@github.com>" --name daed --license 'MIT AGPL' \
              --package "$package_file_base.$package_manager" \
              --after-install ../install/package_after_install.sh \
              --after-remove ../install/package_after_remove.sh \
              -C package-root \
              .
          done
          dpkg-deb -c "$package_file_base.deb" | grep -F './usr/bin/daed'
          dpkg-deb -c "$package_file_base.deb" | grep -F './usr/share/daed/web/index.html'
          rpm -qpl "$package_file_base.rpm" | grep -F '/usr/bin/daed'
          rpm -qpl "$package_file_base.rpm" | grep -F '/usr/share/daed/web/index.html'
          if [ -n "$ARCH_PACMAN" ]; then
            bsdtar -tf "$package_file_base.pacman" | grep -F 'usr/bin/daed'
            bsdtar -tf "$package_file_base.pacman" | grep -F 'usr/share/daed/web/index.html'
          fi
          popd || exit 1
          cp "bundled/$package_file_base.deb" ./output_packages/installer-${{ steps.get_filename.outputs.BUNDLE_NAME }}.deb
          cp "bundled/$package_file_base.rpm" ./output_packages/installer-${{ steps.get_filename.outputs.BUNDLE_NAME }}.rpm
          if [ "$ARCH_PACMAN" == 'pacman' ];then
            cp "bundled/$package_file_base.pacman" ./output_packages/installer-${{ steps.get_filename.outputs.BUNDLE_NAME }}.pkg.tar.zst
          fi
          ls ./output_packages/ | grep -E ".deb|.rpm|.pkg.tar.zst"

      - name: Upload artifact - packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get_filename.outputs.BUNDLE_NAME }}-packages
          path: |
            output_packages/*

  upload-release:
    needs: [release-please, checkout-full-src, build-bundle]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: main
          path: DaeNext
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: release/

      - name: Prepare files for upload
        run: |
          set -euo pipefail

          # Parallel execution helper function
          # Usage: parallel_exec <function_name> <input_list>
          parallel_exec() {
              local func_name="$1"
              shift
              export -f "$func_name"
              echo "$@" | tr ' ' '\n' | xargs -P 8 -I {} bash -c 'set -e; '"$func_name"' "$@"' _ {}
          }

          release_file_list="$(mktemp)"
          find release -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.zip" \) | sort > "$release_file_list"
          if [ ! -s "$release_file_list" ]; then
            echo "No release files found under release/."
            find release -maxdepth 3 -type f | sort || true
            exit 1
          fi
          while IFS= read -r f; do
            cp "$f" ./
          done < "$release_file_list"

          expected_installers=(
            installer-daed-linux-x86_32.deb
            installer-daed-linux-x86_32.rpm
            installer-daed-linux-x86_32.pkg.tar.zst
            installer-daed-linux-riscv64.deb
            installer-daed-linux-riscv64.rpm
            installer-daed-linux-riscv64.pkg.tar.zst
            installer-daed-linux-arm64.deb
            installer-daed-linux-arm64.rpm
            installer-daed-linux-arm64.pkg.tar.zst
            installer-daed-linux-x86_64.deb
            installer-daed-linux-x86_64.rpm
            installer-daed-linux-x86_64.pkg.tar.zst
            installer-daed-linux-x86_64_v2_sse.deb
            installer-daed-linux-x86_64_v2_sse.rpm
            installer-daed-linux-x86_64_v2_sse.pkg.tar.zst
            installer-daed-linux-x86_64_v3_avx2.deb
            installer-daed-linux-x86_64_v3_avx2.rpm
            installer-daed-linux-x86_64_v3_avx2.pkg.tar.zst
            installer-daed-linux-mips64.deb
            installer-daed-linux-mips64.rpm
            installer-daed-linux-mips64le.deb
            installer-daed-linux-mips64le.rpm
            installer-daed-linux-mips32le.deb
            installer-daed-linux-mips32le.rpm
            installer-daed-linux-mips32.deb
            installer-daed-linux-mips32.rpm
          )
          for installer in "${expected_installers[@]}"; do
            test -f "$installer" || {
              echo "Missing expected release installer: $installer" >&2
              exit 1
            }
          done
          installer_count="$(find . -maxdepth 1 -type f -name 'installer-daed-linux-*' | wc -l | tr -d ' ')"
          if [ "$installer_count" -lt "${#expected_installers[@]}" ]; then
            echo "Expected at least ${#expected_installers[@]} release installers, found $installer_count" >&2
            exit 1
          fi

          # Create zip archives in parallel
          create_zip() {
              local dir="$1"
              zip -9r "../${dir}.zip" "$dir" && echo "✓ Created ${dir}.zip"
          }
          cd release
          dirs=$(ls -d daed-linux* web)
          parallel_exec create_zip $dirs
          cd ..

          # Verify all zip files
          verify_zip() {
              local dir="$1"
              if [[ ! -f "${dir}.zip" ]]; then
                  echo "✗ Failed to create ${dir}.zip" && exit 1
              fi
              unzip -t "${dir}.zip" > /dev/null 2>&1 || { echo "✗ ${dir}.zip is corrupted"; exit 1; }
              echo "✓ Verified ${dir}.zip"
          }
          parallel_exec verify_zip $dirs

          # Generate checksums in parallel
          generate_dgst() {
              local package="$1"
              echo "$(md5 -q "$package")  $package  md5" >> "$package.dgst"
              echo "$(shasum -a 1 "$package")  sha1" >> "$package.dgst"
              echo "$(shasum -a 256 "$package")  sha256" >> "$package.dgst"
              echo "$(shasum -a 512 "$package")  sha512" >> "$package.dgst"
              echo "✓ Generated checksums for $package"
          }
          packages=$(ls | grep -E "\.deb$|\.pkg\.tar\.zst$|\.rpm$|\.zip$")
          parallel_exec generate_dgst $packages

          echo "Show files are going to upload..."
          ls -lh | grep -E ".deb|.pkg.tar.zst|.rpm|.zip"

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          CHECKOUT_REF: ${{ needs.release-please.outputs.checkout_ref }}
          MANUAL_RELEASE: ${{ needs.release-please.outputs.manual_release }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
            exit 0
          fi

          if [ "$MANUAL_RELEASE" = "true" ]; then
            gh release create "$TAG_NAME" --target "$CHECKOUT_REF" --generate-notes
          else
            gh release create "$TAG_NAME" --verify-tag --generate-notes
          fi

      - name: Upload Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          # Parallel execution helper function
          parallel_exec() {
              local func_name="$1"
              shift
              export -f "$func_name"
              echo "$@" | tr ' ' '\n' | xargs -P 8 -I {} bash -c 'set -e; '"$func_name"' "$@"' _ {}
          }

          upload_file() {
              local file="$1"
              gh release upload "$TAG_NAME" "$file" --clobber
              echo "✓ Uploaded $file"
          }
          export TAG_NAME

          files=$(ls | grep -E "\.deb$|\.pkg\.tar\.zst$|\.rpm$|\.zip$|\.dgst$")
          parallel_exec upload_file $files

  # Publish container image when release is created
  publish-container-image:
    needs: [release-please, build-web]
    if: ${{ needs.release-please.outputs.publish_extras == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: apps/web/dist/

      - name: Prepare Tag
        id: prep
        env:
          REF: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tag=${REF:1}
          echo "IMAGE=ksong008/daednext" >> $GITHUB_OUTPUT
          echo "TAG=$tag" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_PASS }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: DAED_VERSION=${{ steps.prep.outputs.TAG }}
          builder: ${{ steps.buildx.outputs.name }}
          file: publish.Dockerfile
          target: prod
          platforms: linux/386,linux/amd64,linux/arm64
          push: true
          load: true
          tags: |
            ${{ steps.prep.outputs.IMAGE }}:latest
            ${{ steps.prep.outputs.IMAGE }}:${{ steps.prep.outputs.TAG }}
            ghcr.io/${{ steps.prep.outputs.IMAGE }}:latest
            ghcr.io/${{ steps.prep.outputs.IMAGE }}:${{ steps.prep.outputs.TAG }}
            quay.io/${{ steps.prep.outputs.IMAGE }}:latest
            quay.io/${{ steps.prep.outputs.IMAGE }}:${{ steps.prep.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
